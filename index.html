<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Planner</title>
  <meta name="theme-color" content="#F2F4F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11151C" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Planner">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Apply the saved theme before first paint so the page never flashes.
    try { const t = JSON.parse(localStorage.getItem('planner.theme')); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <script src="config.js"></script>
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Main navigation"></aside>
    <div id="scrim" hidden></div>
    <main id="main">
      <header id="topbar">
        <button class="icon-btn" id="menu-btn" aria-label="Open menu"></button>
        <span id="topbar-title"></span>
      </header>
      <div id="view"></div>
    </main>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
